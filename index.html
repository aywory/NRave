<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NRave — Watch Together</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
    <div id="app-root">

        <!-- ЛЕВАЯ ЧАСТЬ: ВИДЕО -->
        <div class="main-content">

            <!-- ШАПКА (скрываемая часть — лого + поле ссылки) -->
            <header class="top-bar" id="topBar">
                <div class="logo">
                    <span class="logo-icon">◈</span>
                    <span class="logo-text">NRave</span>
                </div>

                <div class="url-form">
                    <div class="url-input-wrap">
                        <span class="url-icon" id="platformIcon">🔗</span>
                        <input type="text" id="ytLink" placeholder="YouTube, VK, Rutube, Twitch, .mp4 ...">
                        <span class="platform-badge" id="platformBadge"></span>
                    </div>
                    <button class="btn btn-load" onclick="loadVideo()">Смотреть</button>
                </div>
            </header>

            <!-- ПЛАВАЮЩАЯ ПАНЕЛЬ УПРАВЛЕНИЯ (видна всегда, даже если шапка свёрнута) -->
            <div class="header-controls" id="headerControls">
                <div id="status-info" class="status-pill">
                    <span class="status-dot"></span>
                    <span id="status-text">Подключение...</span>
                </div>

                <div class="profile-wrap">
                    <button id="profileBtn" class="btn btn-host" onclick="toggleProfilePanel()" title="Профиль">
                        <span id="profileAvatar">🙂</span>
                        <span id="crownBadge" class="crown-badge" style="display:none">👑</span>
                    </button>

                    <div id="profilePanel" class="profile-panel">
                        <label class="profile-label">Ваше имя</label>
                        <div class="profile-row">
                            <input type="text" id="nicknameInput" maxlength="20" placeholder="Ваше имя">
                            <button class="btn btn-load" onclick="saveNickname()">✓</button>
                        </div>
                        <div class="profile-divider"></div>
                        <div id="hostControlArea"></div>
                    </div>
                </div>

                <button class="btn btn-toggle" onclick="toggleTopBar()" id="toggleBtn"
                    title="Скрыть/показать панель">▲</button>
            </div>

            <!-- ПАНЕЛЬ УЧАСТНИКОВ -->
            <div id="user-times-panel"></div>

            <!-- ВИДЕОПЛЕЕР -->
            <div class="video-box">
                <div class="video-ratio">
                    <!-- Заглушка -->
                    <div class="video-placeholder" id="videoPlaceholder">
                        <div class="placeholder-inner">
                            <div class="placeholder-icon">◈</div>
                            <p class="placeholder-title">NRave</p>
                            <p class="placeholder-hint">Вставьте ссылку на видео выше,<br>чтобы начать совместный
                                просмотр</p>
                            <div class="supported-platforms">
                                <span class="platform-tag yt">YouTube</span>
                                <span class="platform-tag vk">VK Видео</span>
                                <span class="platform-tag tw">Twitch</span>
                                <span class="platform-tag mp">Rutube</span>
                                <span class="platform-tag mp">MP4 / HLS</span>
                            </div>
                        </div>
                    </div>

                    <!-- Оверлей для мобилок (не хост) -->
                    <div id="mobile-overlay" onclick="activateMobilePlayer()">
                        <div class="overlay-content">
                            <span class="overlay-icon">▶</span>
                            <b>Нажмите для синхронизации</b>
                        </div>
                    </div>

                    <!-- YouTube -->
                    <div id="yt-player-wrap" style="display:none; position:absolute; inset:0;">
                        <div id="player"></div>
                    </div>

                    <!-- VK / Twitch / iframe -->
                    <div id="iframe-player-wrap" style="display:none; position:absolute; inset:0;">
                        <iframe id="genericIframe" allowfullscreen allow="autoplay; fullscreen"
                            style="width:100%;height:100%;border:none;"></iframe>
                    </div>

                    <!-- Прямой видеофайл -->
                    <div id="video-player-wrap" style="display:none; position:absolute; inset:0;">
                        <video id="directVideo" controls autoplay
                            style="width:100%;height:100%;background:#000;"></video>
                    </div>
                </div>
            </div>

        </div>

        <!-- ПРАВАЯ ЧАСТЬ: ЧАТ -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Чат</span>
                <span class="online-count" id="onlineCount">0 онлайн</span>
            </div>

            <div id="chat"></div>

            <div id="emojiPicker" class="emoji-picker"></div>

            <div class="footer">
                <button class="emoji-btn" onclick="toggleEmojiPicker()" title="Эмодзи">😀</button>
                <input type="text" id="msgInput" placeholder="Написать в чат...">
                <button class="send-btn" onclick="sendMessage()" title="Отправить">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
